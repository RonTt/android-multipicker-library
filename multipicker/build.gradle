apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

version = "1.7"
group = "com.kbeanie"

signing {
    required {
        gradle.taskGraph.hasTask("uploadArchives")
    }
    println 'Signing...'
    sign configurations.archives
}

android {
    namespace 'com.kbeanie.multipicker'

    signingConfigs {
        release {
            /*keyAlias ""
            keyPassword ""
            storeFile file('../extras/release.keystore')
            storePassword ""*/
        }
    }

    compileSdkVersion 34

    defaultConfig {
        minSdkVersion 29
        targetSdkVersion 34
        versionCode 1
        versionName "1.7"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets{
        main{
            java {
                exclude 'com.kbeanie.multipicker.test'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant("release")      // <-- ключ!
        // при желании: withSourcesJar()
    }
}

dependencies {
    compileOnly 'androidx.appcompat:appcompat:1.7.1'
    testImplementation 'junit:junit:4.13.2'

}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release           // ← компонент точно существует

                groupId    = 'com.github.RonTt'    // (как у deinlandel)
                artifactId = 'android-multipicker-library'
                version    = '1.7-jitpack7'        // или считайте из tag/gradle.properties
            }
        }
    }
}
